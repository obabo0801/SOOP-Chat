<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>매크로</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/chat.css" />
    <script type="module" src="/index.js"></script>
  </head>
  <body>
    <header>
      <div class="identity">
        <a id="station" class="identity" target="_blank" rel="noopener noreferrer">
          <img id="portrait" class="portrait" alt="프로필" hidden />
          <strong id="broadcaster"></strong>
        </a>
        <img id="emblem" class="emblem" alt="엠블럼" hidden />
        <button id="information" class="information" type="button" title="스트리머 정보">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v6M12 7h.01" />
          </svg>
        </button>
      </div>
      <div class="account-menu">
        <button id="account" type="button" title="로그인" hidden>
          <span id="account-label">로그인</span>
          <img id="account-avatar" alt="내 프로필" hidden />
        </button>
        <div class="menu">
          <button id="menu" type="button" title="메뉴">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div id="menu-items" hidden>
            <button id="macro-open" type="button">매크로 편집</button>
            <button id="logs-open" type="button">로그 검색</button>
            <button id="notify-open" type="button">알림 설정</button>
            <button id="link-copy" type="button" hidden>접속 주소 복사</button>
            <label class="switch"
              ><input id="menu-enabled" type="checkbox" />매크로 사용</label
            >
          </div>
        </div>
      </div>
    </header>
    <dialog id="notify">
      <div class="heading">
        <h2>알림 설정</h2>
        <button id="notify-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <form id="notify-form">
        <label class="switch"><input id="notify-enabled" type="checkbox" />알림 사용</label>
        <details id="notify-connection">
          <summary>연결 설정</summary>
          <label>서버 주소<input id="notify-server" type="text" /></label>
          <label>알림 채널<input id="notify-topic" type="text" /></label>
          <label>인증 토큰<input id="notify-token" type="password" autocomplete="off" /></label>
          <label class="switch"><input id="notify-clear" type="checkbox" />토큰 삭제</label>
        </details>
        <div id="notify-events"></div>
        <div class="notify-detection">
          <label>키워드<textarea id="notify-keywords" rows="3"></textarea></label>
          <label>닉네임<textarea id="notify-nicknames" rows="3"></textarea></label>
        </div>
        <p id="notify-status" hidden></p>
        <div class="actions">
          <button id="notify-test" type="button">테스트 알림</button>
          <button id="notify-save" type="submit">저장</button>
        </div>
      </form>
    </dialog>
    <dialog id="login">
      <div class="heading">
        <button id="login-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <h2><img id="login-logo" alt="SOOP 로그인" /></h2>
      <form id="login-form">
        <input
          id="login-id"
          type="text"
          placeholder="아이디"
          autocomplete="username"
          required
        />
        <input
          id="login-password"
          type="password"
          placeholder="비밀번호"
          autocomplete="current-password"
          required
        />
        <details>
          <summary>2차 비밀번호</summary>
          <input
            id="login-second"
            type="password"
            placeholder="2차 비밀번호"
            autocomplete="off"
          />
        </details>
        <label class="switch"><input id="login-save" type="checkbox" />아이디 저장</label>
        <p id="login-error" hidden></p>
        <button id="login-submit" type="submit">로그인</button>
      </form>
    </dialog>
    <div id="screen" hidden>
      <div class="player" id="player" tabindex="0">
        <video id="video" autoplay playsinline muted></video>
        <div id="video-subtitle" hidden></div>
        <div id="video-state">오프라인</div>
        <dialog id="kicks">
          <div class="heading">
            <h2>강제 퇴장 인원</h2>
            <button id="kicks-close" class="close" type="button" title="닫기">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <p id="kicks-status"></p>
          <div id="kicks-results"></div>
        </dialog>
        <dialog id="members">
          <div class="heading">
            <h2 id="members-title">채팅 참여 인원 (0명)</h2>
            <button id="members-close" class="close" type="button" title="닫기">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <input
            id="members-search"
            type="search"
            placeholder="닉네임, 아이디 검색"
            maxlength="100"
          />
          <p id="members-status"></p>
          <div id="members-list" tabindex="0"></div>
        </dialog>
        <div class="playback">
          <div id="timeline-preview" hidden>
            <div>
              <canvas id="timeline-image" width="320" height="180" hidden></canvas
              ><span id="timeline-placeholder">∞</span>
            </div>
            <span id="timeline-offset"></span>
          </div>
          <input
            id="timeline"
            type="range"
            min="0"
            max="0"
            step="0.1"
            value="0"
            disabled
          />
          <div class="video-controls">
            <button id="pause" class="video-button" type="button" title="재생" disabled>
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            </button>
            <button
              id="rewind"
              class="video-button"
              type="button"
              title="10초 뒤로 (←)"
              disabled
            >
              <svg viewBox="0 0 24 24">
                <path d="M12 5a8 8 0 1 1-8 8M15 2l-3 3 3 3" />
                <text x="12" y="13" text-anchor="middle" dominant-baseline="central">
                  10
                </text>
              </svg>
            </button>
            <div id="video-volume">
              <button id="volume" class="video-button" type="button" title="음소거 해제">
                <svg viewBox="0 0 24 24">
                  <path d="M3 9v6h4l5 4V5L7 9zm13 0 5 6m0-6-5 6" />
                </svg>
              </button>
              <input id="loudness" type="range" min="0" max="1" step="0.05" value="1" />
            </div>
            <button id="live" type="button" title="라이브 (L)" disabled>라이브</button>
            <span id="clock">00:00</span>
            <div class="video-spacer"></div>
            <button
              id="video-clip"
              class="video-button"
              type="button"
              title="유저클립 & 캐치"
              disabled
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="17" rx="5" />
                <path d="M3 10h18M7 4l-2 6m7-6-2 6m7-6-2 6" />
              </svg>
            </button>
            <button
              id="video-save"
              class="video-button"
              type="button"
              title="저장"
              disabled
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
              </svg>
            </button>
            <div class="resolution">
              <button id="quality" type="button" disabled></button>
              <div id="qualities" hidden></div>
            </div>
            <button id="captions" class="video-button" type="button" title="자막" hidden>
              <svg viewBox="0 0 24 24">
                <defs>
                  <mask id="caption-mask">
                    <rect
                      x="3"
                      y="5"
                      width="18"
                      height="14"
                      rx="2"
                      fill="white"
                      stroke="none"
                    />
                    <path
                      d="M10 9H7v6h3m7-6h-3v6h3"
                      fill="none"
                      stroke="black"
                      stroke-width="1.5"
                    />
                  </mask>
                </defs>
                <rect class="caption-outline" x="3" y="5" width="18" height="14" rx="2" />
                <rect
                  class="caption-fill"
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                  mask="url(#caption-mask)"
                />
                <path class="caption-letters" d="M10 9H7v6h3m7-6h-3v6h3" />
              </svg>
            </button>
            <div class="video-settings">
              <button
                id="settings"
                class="video-button"
                type="button"
                title="설정"
                hidden
              >
                <svg viewBox="0 0 24 24">
                  <path
                    fill-rule="evenodd"
                    d="m9.2 3-.5 2-1.5.9-2-.6-2.8 4.8 1.5 1.4v1.8l-1.5 1.4 2.8 4.8 2-.6 1.5.9.5 2h5.6l.5-2 1.5-.9 2 .6 2.8-4.8-1.5-1.4v-1.8l1.5-1.4-2.8-4.8-2 .6-1.5-.9-.5-2zM15 12a3 3 0 1 0-6 0 3 3 0 0 0 6 0"
                  />
                </svg>
              </button>
              <div id="settings-menu" hidden>
                <button id="subtitle-settings" type="button" hidden>
                  <span>자막 설정</span><span id="subtitle-label">OFF</span><span>›</span>
                </button>
              </div>
              <div id="subtitle-menu" hidden>
                <div class="subtitle-heading">
                  <button id="subtitle-back" type="button" title="뒤로가기">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    >
                      <path d="m14 6-6 6 6 6" />
                    </svg>
                  </button>
                  <span>자막 설정</span>
                </div>
                <div id="subtitle-options"></div>
              </div>
            </div>
            <button id="pip" class="video-button" type="button" title="PIP 모드">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="1" />
                <path d="M12 11h7v6h-7z" />
              </svg>
            </button>
            <button
              id="theater"
              class="video-button"
              type="button"
              title="스크린 모드 (S)"
            >
              <svg viewBox="0 0 24 24">
                <rect x="2" y="5" width="20" height="14" rx="1" />
                <path d="M6 5v14m12-14v14" />
              </svg>
            </button>
            <button
              id="fullscreen"
              class="video-button"
              type="button"
              title="전체 화면 (F)"
            >
              <svg viewBox="0 0 24 24">
                <path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="broadcast">
        <div class="broadcast-top">
          <div class="broadcast-identity">
            <a id="video-station" target="_blank" rel="noopener noreferrer">
              <img id="video-portrait" alt="" hidden />
            </a>
            <a id="video-name" target="_blank" rel="noopener noreferrer"></a>
            <img id="video-emblem" class="emblem" alt="엠블럼" hidden />
            <div class="video-stats">
              <span id="video-subscription" title="구독">
                <svg viewBox="0 0 24 24">
                  <path d="M4 3h13v11a6.5 6.5 0 0 1-13 0zm13 1h2a3 3 0 0 1 0 6h-2" />
                  <path
                    d="m10.5 6 1.3 2.6 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z"
                  />
                </svg>
                <span id="video-subscription-count"></span>
              </span>
              <span id="video-favorite" title="즐겨찾기">
                <svg viewBox="0 0 24 24">
                  <path d="m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" />
                </svg>
                <span id="video-favorite-count"></span>
              </span>
              <span id="video-up" title="UP">
                <svg viewBox="0 0 24 24">
                  <path d="M8 10v11H3V10zm0 11h11l2-11h-7l1-6-3-1-4 7" />
                </svg>
                <span id="video-up-count"></span>
              </span>
            </div>
          </div>
          <div class="video-actions">
            <button id="kicks-open" type="button" title="강제 퇴장 인원" disabled>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="9" cy="7" r="3" />
                <path d="M3 20v-2a6 6 0 0 1 12 0v2m2-12 5 5m0-5-5 5" />
              </svg>
            </button>
            <button id="members-open" type="button" title="채팅 참여 인원" disabled>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="9" cy="8" r="3" />
                <path
                  d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m1 3a5 5 0 0 1 4 5"
                />
              </svg>
              <span id="members-count">0</span>
            </button>
            <span class="broadcast-separator">·</span>
            <span id="video-duration"></span>
          </div>
        </div>
        <div class="video-title">
          <span id="video-password" title="비밀 방송" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="4" y="10" width="16" height="12" rx="2" />
              <path d="M7 10V7a5 5 0 0 1 10 0v3m-5 4v4" />
            </svg>
          </span>
          <span id="video-adult" title="19세 이상 방송" hidden>19</span>
          <h2 id="video-title">
            <a id="video-broadcast" target="_blank" rel="noopener noreferrer"></a>
          </h2>
        </div>
        <div id="video-tags"></div>
      </div>
    </div>
    <section id="conversation" hidden>
      <div class="chat-stream">
        <div class="chat-pinned">
          <details id="chat-notice" class="collapsed" hidden>
            <summary>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M4 9h5l10-4v14L9 15H4V9Zm3 6v5h3v-5" />
              </svg>
              공지
            </summary>
            <div class="chat-panel-body">
              <div class="chat-panel-inner"><div id="chat-notice-content"></div></div>
            </div>
          </details>
        </div>
        <div id="chat-log" tabindex="0"></div>
        <button id="chat-bottom" type="button" title="최신 채팅으로 이동" hidden>
          <span id="chat-latest"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="chat-poll-open" type="button" hidden>
          <span>☑</span>
          <span id="chat-poll-label">새 투표가 시작되었습니다.</span>
        </button>
      </div>
      <div class="chat-composer">
        <section id="chat-manager" hidden>
          <div class="heading">
            <h2>매니저 채팅</h2>
            <button id="chat-manager-close" class="close" type="button" title="닫기">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <div id="chat-manager-log"></div>
          <form id="chat-manager-send">
            <textarea
              id="chat-manager-input"
              rows="1"
              placeholder="매니저 채팅 입력"
            ></textarea>
            <button id="chat-manager-submit" type="submit">전송</button>
          </form>
          <p id="chat-manager-status" hidden></p>
        </section>
        <form id="chat-send">
          <button id="chat-target" type="button" hidden></button>
          <button id="chat-sticker" type="button" title="OGQ 제거" hidden>
            <img id="chat-sticker-image" alt="" />
          </button>
          <button id="chat-manage-open" type="button" title="채팅 관리" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 4a8 8 0 0 1 0 16H9l-4 2v-6" />
              <g transform="translate(-1 -1) scale(.6)">
                <path
                  d="m9.2 3-.5 2-1.5.9-2-.6-2.8 4.8 1.5 1.4v1.8l-1.5 1.4 2.8 4.8 2-.6 1.5.9.5 2h5.6l.5-2 1.5-.9 2 .6 2.8-4.8-1.5-1.4v-1.8l1.5-1.4-2.8-4.8-2 .6-1.5-.9-.5-2Z"
                />
                <circle cx="12" cy="12" r="3" />
              </g>
            </svg>
          </button>
          <button id="chat-manager-open" type="button" title="매니저 채팅" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 3a8 8 0 0 1 0 16H9l-4 3v-6a8 8 0 0 1 7-13Z" />
              <path d="M8 15V8l4 4 4-4v7" />
            </svg>
          </button>
          <textarea
            id="chat-input"
            rows="1"
            placeholder="로그인이 필요합니다."
            disabled
            hidden
          ></textarea>
          <div
            id="chat-compose"
            role="textbox"
            contenteditable="false"
            data-placeholder="로그인이 필요합니다."
          ></div>
          <button id="chat-emoticon" type="button" title="이모티콘" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="9" />
              <path d="M8 14c1 4 7 4 8 0M8 9h1m6 0h1" />
            </svg>
          </button>
          <button id="chat-menu-open" type="button" title="더 보기">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="5" cy="12" r="1.7" />
              <circle cx="12" cy="12" r="1.7" />
              <circle cx="19" cy="12" r="1.7" />
            </svg>
          </button>
          <button id="chat-submit" type="submit" disabled>전송</button>
        </form>
      </div>
    </section>
    <dialog id="chat-poll">
      <form id="chat-poll-form">
        <div class="heading">
          <h2>투표하기</h2>
          <button id="chat-poll-close" class="close" type="button" title="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <p id="chat-poll-title"></p>
        <div id="chat-poll-list"></div>
        <div class="chat-poll-buttons">
          <button id="chat-poll-cancel" type="button">취소</button>
          <button id="chat-poll-submit" type="submit" disabled>투표 완료</button>
        </div>
      </form>
    </dialog>
    <dialog id="chat-poll-notice">
      <div class="heading">
        <h2>투표 안내</h2>
        <button id="chat-poll-notice-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <p id="chat-poll-message"></p>
      <button id="chat-poll-notice-confirm" type="button">확인</button>
    </dialog>
    <dialog id="chat-manage">
      <div class="heading">
        <h2>채팅 관리</h2>
        <button id="chat-manage-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="chat-icon-tabs">
        <button id="chat-freeze-tab" class="selected" type="button">얼리기</button>
        <button id="chat-slow-tab" type="button">저속 모드</button>
        <button id="chat-notice-open" type="button">스트리머 공지</button>
        <button id="chat-rule-open" type="button">채팅 규칙</button>
      </div>
      <section id="chat-freezing">
        <div id="chat-grades">
          <label><input type="checkbox" checked disabled />스트리머</label>
          <label><input type="checkbox" />팬클럽</label>
          <label><input type="checkbox" />서포터</label>
          <label><input type="checkbox" />열혈팬</label>
          <label><input type="checkbox" />구독팬</label>
          <label><input type="checkbox" checked />매니저</label>
        </div>
        <label for="chat-freeze-count">선물 개수</label>
        <input id="chat-freeze-count" type="number" min="1" max="10000" value="1" />
        <label for="chat-freeze-month">구독 개월</label>
        <input id="chat-freeze-month" type="number" min="1" step="1" value="1" />
        <div class="chat-setting-row">
          <button id="chat-freeze" type="button">얼리기</button>
          <button id="chat-melt" type="button">녹이기</button>
        </div>
      </section>
      <form id="chat-slow" hidden>
        <label for="chat-slow-count">저속 모드 (초)</label>
        <div class="chat-setting-row">
          <input id="chat-slow-count" type="number" min="0" step="1" value="0" required />
          <button type="submit">적용</button>
          <button id="chat-slow-off" type="button">해제</button>
        </div>
      </form>
      <section id="chat-announcement" hidden>
        <form id="chat-announcement-form">
          <textarea id="chat-announcement-content" rows="5" maxlength="2000"></textarea>
          <button type="submit">저장</button>
        </form>
      </section>
      <section id="chat-rule-edit" hidden>
        <form id="chat-rule-form">
          <textarea id="chat-rule-input" rows="5" maxlength="2000"></textarea>
          <button type="submit">저장</button>
        </form>
      </section>
    </dialog>
    <dialog id="chat-multi" class="chat-option">
      <div class="heading">
        <h2>멀티 모드</h2>
        <button id="chat-multi-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <form id="chat-multi-form">
        <label for="chat-multi-count">접속 개수</label>
        <div class="chat-setting-row">
          <input
            id="chat-multi-count"
            type="number"
            min="1"
            step="1"
            value="1"
            required
          />
          <button id="chat-multi-start" type="submit">시작</button>
          <button id="chat-multi-stop" type="button" disabled>정지</button>
        </div>
      </form>
      <p id="chat-multi-summary"></p>
      <div id="chat-multi-list"></div>
    </dialog>
    <dialog id="chat-menu">
      <div class="heading">
        <h2>더 보기</h2>
        <button id="chat-menu-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="chat-setting-menu">
        <button id="chat-display-open" type="button">이모티콘 표시</button>
        <button id="chat-nickname-open" type="button">닉네임 변경</button>
        <button id="chat-entry-open" type="button">입장 표시</button>
        <button id="chat-translation-open" type="button">채팅 번역</button>
        <button id="chat-clear" type="button">채팅 지우기</button>
        <button id="chat-popup" type="button">채팅 팝업</button>
        <button id="chat-size-open" type="button">채팅 크기</button>
        <button id="chat-multi-open" type="button">멀티 모드</button>
      </div>
    </dialog>
    <dialog id="chat-display" class="chat-option">
      <div class="heading">
        <h2>이모티콘 표시</h2>
        <button id="chat-display-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="chat-setting-menu">
        <label class="switch"><input id="chat-show-emotes" type="checkbox" checked />이모티콘 보기</label>
        <label class="switch"><input id="chat-move-emotes" type="checkbox" checked />이모티콘 움직이기</label>
        <label class="switch"><input id="chat-small-ogq" type="checkbox" />OGQ 이모티콘 작게</label>
      </div>
    </dialog>
    <dialog id="chat-entry" class="chat-option">
      <div class="heading">
        <h2>입장 표시</h2>
        <button id="chat-entry-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <label class="switch"><input id="chat-show-entry" type="checkbox" checked />입장 표시</label>
    </dialog>
    <dialog id="chat-translation" class="chat-option">
      <div class="heading">
        <h2>채팅 번역</h2>
        <button id="chat-translation-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <label class="switch"><input id="chat-translate" type="checkbox" />채팅 번역</label>
    </dialog>
    <dialog id="chat-size" class="chat-option">
      <div class="heading">
        <h2>채팅 크기</h2>
        <button id="chat-size-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="chat-size-control">
        <button id="chat-size-down" type="button" title="작게">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M6 12h12" />
          </svg>
        </button>
        <output id="chat-size-value">2</output>
        <button id="chat-size-up" type="button" title="크게">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M6 12h12M12 6v12" />
          </svg>
        </button>
      </div>
    </dialog>
    <dialog id="chat-nickname" class="chat-option">
      <div class="heading">
        <h2>닉네임 변경</h2>
        <button id="chat-nickname-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <form id="chat-nickname-form">
        <input id="chat-nickname-input" type="text" placeholder="닉네임" />
        <button type="submit">변경</button>
      </form>
    </dialog>
    <dialog id="chat-rule">
      <div class="heading">
        <div class="chat-rule-heading">
          <img id="chat-rule-avatar" alt="프로필" hidden />
          <div>
            <div id="chat-rule-name"></div>
            <h2>채팅규칙</h2>
          </div>
        </div>
        <button id="chat-rule-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="chat-rule-content"></div>
      <button id="chat-rule-agree" type="button">규칙에 동의합니다!</button>
    </dialog>
    <dialog id="chat-person">
      <div class="heading">
        <a
          id="chat-station"
          class="chat-person-identity"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img id="chat-avatar" alt="프로필" hidden />
          <div><b id="chat-name"></b><small id="chat-id"></small></div>
        </a>
        <button id="chat-person-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="chat-subscription" hidden></div>
      <div id="chat-person-actions"></div>
    </dialog>
    <dialog id="chat-communication">
      <div class="heading">
        <div class="chat-history-heading">
          <button id="chat-communication-back" type="button" title="프로필로 돌아가기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="m14 6-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <h2>소통</h2>
        </div>
        <button id="chat-communication-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <button id="chat-whisper" type="button">귓속말 보내기</button>
    </dialog>
    <dialog id="chat-icons">
      <div class="heading">
        <h2>이모티콘</h2>
        <button id="chat-icons-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="chat-icon-tabs">
        <button id="chat-icons-emoticon" class="selected" type="button">이모티콘</button>
        <button id="chat-icons-ogq" type="button">OGQ</button>
      </div>
      <div id="chat-icons-list"></div>
      <div id="chat-ogq" hidden>
        <div id="chat-ogq-packs"></div>
        <div id="chat-ogq-list"></div>
      </div>
    </dialog>
    <dialog id="chat-history">
      <div class="heading">
        <div class="chat-history-heading">
          <a id="chat-history-station" target="_blank" rel="noopener noreferrer">
            <img id="chat-history-avatar" alt="프로필" hidden />
          </a>
          <a id="chat-history-name" target="_blank" rel="noopener noreferrer"></a>
          <button
            id="chat-history-information"
            class="information"
            type="button"
            title="스트리머 정보"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v6M12 7h.01" />
            </svg>
          </button>
        </div>
        <button id="chat-history-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="chat-history-log"></div>
    </dialog>
    <p id="status" role="status"></p>
    <dialog id="logs">
      <div class="heading">
        <h2>로그 검색</h2>
        <button id="logs-close" class="close" type="button" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <form id="logs-form">
        <div class="logs-filters">
          <label
            >날짜
            <select id="logs-period">
              <option value="today">오늘</option>
              <option value="yesterday">어제</option>
              <option value="week">최근 7일</option>
              <option value="custom">직접 선택</option>
            </select>
          </label>
          <label>시작<input id="logs-start" type="date" required /></label>
          <label>종료<input id="logs-end" type="date" required /></label>
          <label
            >종류
            <select id="logs-type">
              <option value="all">전체</option>
              <option value="chat">채팅</option>
              <option value="manager" id="logs-manager">매니저 채팅</option>
              <option value="system">알림</option>
              <option value="gift">후원</option>
              <option value="mute">채금</option>
              <option value="kick">강퇴</option>
            </select>
          </label>
        </div>
        <div class="logs-query">
          <input
            id="logs-query"
            type="search"
            placeholder="닉네임, 아이디, 내용"
            maxlength="200"
          />
          <button type="submit">검색</button>
        </div>
      </form>
      <p id="logs-status"></p>
      <div id="logs-results"></div>
    </dialog>
    <dialog id="macros" data-page="list">
      <div class="heading">
        <div class="actions">
          <button id="macro-back" type="button" title="목록">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m14 6-6 6 6 6" />
            </svg>
          </button>
          <h2>매크로</h2>
        </div>
        <div class="actions macro-controls">
          <label class="switch"><input id="enabled" type="checkbox" />매크로 사용</label>
          <button id="save" type="button" disabled>저장</button>
        </div>
        <button id="macro-close" class="close" type="button" title="닫기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <p id="macro-status" role="status"></p>
      <main>
        <aside>
          <div class="heading">
            <h2>목록</h2>
            <button id="add" type="button">추가</button>
          </div>
          <input id="search" type="search" placeholder="이름 검색" />
          <nav id="list"></nav>
        </aside>
        <section>
          <p id="empty">매크로를 선택해주세요.</p>
          <form id="form" hidden>
            <div id="macro-preview"></div>
            <div class="heading">
              <h2 id="heading">설정</h2>
              <div class="actions">
                <label class="switch"
                  ><input id="active" type="checkbox" />이 규칙 사용</label
                >
                <span class="divider"></span>
                <div class="actions macro-tools">
                  <button id="up" type="button">위로</button
                  ><button id="down" type="button">아래로</button>
                  <button id="duplicate" type="button">복사</button
                  ><button id="remove" type="button">삭제</button>
                </div>
              </div>
            </div>
            <div class="columns">
              <label>이름<input id="name" autocomplete="off" /></label>
              <label
                >종류<select id="kind">
                  <option value="command">명령어</option>
                  <option value="text">문구 감지</option>
                  <option value="regex">단어 감지</option>
                  <option value="event">이벤트</option>
                  <option value="interval">타이머</option>
                </select></label
              >
            </div>
            <div class="columns">
              <div>
                <label id="cooldown-field"
                  >대기 시간 (초)<input id="cooldown" type="number" min="0" step="any"
                /></label>
                <label id="interval-field"
                  >반복 시간 (초)<input id="interval" type="number" min="1" step="any"
                /></label>
              </div>
              <label
                >답변 위치<select id="output">
                  <option value="chat">전체 채팅</option>
                  <option value="manager">매니저 채팅</option>
                  <option value="direct">귓속말</option>
                </select></label
              >
            </div>
            <div class="columns">
              <label id="access-field"
                >사용 권한<select id="access">
                  <option value="all">전체</option>
                  <option value="manager">매니저 이상</option>
                  <option value="streamer">스트리머</option>
                </select></label
              >
              <label id="flags-field">정규식<input id="flags" placeholder="i" /></label>
            </div>
            <div class="columns options">
              <label id="edit-field" class="switch"
                ><input id="edit" type="checkbox" />매니저 채팅으로 수정</label
              >
              <label id="commands-field" class="switch"
                ><input id="commands" type="checkbox" />없는 명령어 숨기기</label
              >
            </div>
            <label
              >동작<select id="action">
                <option value="reply">답변</option>
                <option value="roulette">룰렛</option>
                <option value="multi">멀티 모드</option>
                <option value="notify">알림</option>
                <option value="warn">경고</option>
                <option value="mute">채금</option>
                <option value="kick">강퇴</option>
              </select></label
            >
            <label id="pattern-field"
              ><span id="pattern-label">명령어</span>
              <textarea id="pattern" rows="3" placeholder="!인사&#10;!안녕"></textarea>
            </label>
            <div id="events-field" hidden>
              <label>이벤트 선택</label>
              <div id="events" class="events"></div>
            </div>
            <label id="count-field" hidden
              >채금 횟수<select id="count">
                <option value="0">경고</option>
                <option value="1">1회</option>
                <option value="2">2회</option>
                <option value="3">3회</option>
              </select></label
            >
            <div class="actions assets">
              <button id="emoticon" type="button">이모티콘</button>
              <span id="divider"></span>
              <div id="ogq-field">
                <button id="ogq" type="button">OGQ</button>
              </div>
            </div>
            <div id="emoticon-picker" hidden>
              <input id="emoticon-search" type="search" placeholder="이모티콘 검색" />
              <div id="emoticons" class="stickers"></div>
            </div>
            <div id="picker" hidden>
              <div id="packs" class="stickers"></div>
              <hr id="separator" hidden />
              <div id="stickers" class="stickers"></div>
            </div>
            <label for="message">답변</label>
            <button id="attachment" type="button" title="OGQ 해제" hidden>
              <img id="ogq-image" />
            </button>
            <div id="message" contenteditable="true" role="textbox"></div>
            <textarea id="reply" hidden></textarea>
            <div id="roulette" hidden>
              <label>룰렛 제목<input id="title" placeholder="[{개수} 룰렛]" /></label>
              <div class="columns">
                <label>기본 개수<input id="default" type="number" min="1" /></label>
                <label
                  >룰렛 번호<textarea id="index" rows="2" placeholder="0"></textarea>
                </label>
              </div>
              <label
                >개수 범위<textarea
                  id="ranges"
                  rows="3"
                  placeholder="50~51&#10;500~510"
                ></textarea>
              </label>
              <label
                >관련 번호<textarea
                  id="numbers"
                  rows="3"
                  placeholder="50, 51, 500, 501"
                ></textarea>
              </label>
            </div>
          </form>
        </section>
      </main>
    </dialog>
    <dialog id="profile">
      <div class="heading">
        <h2>스트리머 정보</h2>
        <button id="profile-close" class="close" type="button" title="닫기">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="identity">
        <img id="profile-portrait" class="portrait" alt="프로필" hidden />
        <div>
          <h2 id="profile-name"></h2>
          <p id="profile-id"></p>
        </div>
      </div>
      <p id="profile-description" hidden></p>
      <div id="profile-details"></div>
    </dialog>
  </body>
</html>
